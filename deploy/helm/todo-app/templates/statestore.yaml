apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: {{ .Values.redis.host | default "redis-master:6379" }}
  - name: redisPassword
    secretKeyRef:
      name: {{ .Values.redis.secretName | default "redis" }}
      key: {{ .Values.redis.secretKey | default "redis-password" }}
  - name: actorStateStore
    value: "true"
